<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal website of Logan Fergusson">
  <title>Logan Fergusson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f7f5f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      /* Dark overlay keeps the text readable over the photo */
      background:
        linear-gradient(rgba(10, 14, 12, 0.45), rgba(10, 14, 12, 0.55)),
        url("background.png") center / cover no-repeat fixed,
        #2b302c;
      color: var(--text);
      font-family: "Fraunces", Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 16px;
    }
    h1 {
      font-weight: 500;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    nav a {
      font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
      font-weight: 500;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
      padding: 12px 24px;
      border: 1.5px solid rgba(247, 245, 240, 0.85);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: background 0.15s, color 0.15s;
    }
    nav a:hover,
    nav a:focus-visible {
      background: var(--text);
      color: #1c1b19;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Logan Fergusson</h1>
  </main>
  <nav aria-label="Sections">
    <a href="recent-work.html">Recent Work</a>
    <a href="semiconductor.html">Semiconductor</a>
    <a href="energetics.html">Energetics</a>
  </nav>
</body>
</html>
